name = "lean-nct"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanNct"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "LeanNct"

# The Comparator Challenge: the auditable statement surface.
[[lean_lib]]
name = "Challenge"

# The Comparator solution: re-exports the proved theorems for `comparator.json`.
[[lean_lib]]
name = "Solution"