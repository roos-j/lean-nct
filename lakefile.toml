name = "lean-nct"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanNct"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "LeanNct"

# The Comparator Challenge: the auditable statement surface. Its own library so
# that its import closure stays Mathlib-only — Palomar recompiles the Challenge
# against a frozen Lean core + Mathlib environment and rejects any source
# outside that allowlist, including project-local helpers and `Informal`.
# Generated by `lake exe stan_file`; see .github/workflows/update-trusted-base.yml.
[[lean_lib]]
name = "Challenge"