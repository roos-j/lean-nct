name: Build and publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # 2025-07-02
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          mk_all-check: false

      - name: Compile API documentation
        shell: bash
        run: |
          set -euo pipefail
          docgen_rev="$(cut -d: -f2 < lean-toolchain)"
          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "lean-nct"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$docgen_rev"
          EOF
          (
            cd docbuild
            MATHLIB_NO_CACHE_ON_UPDATE=1 ~/.elan/bin/lake update lean-nct
            ~/.elan/bin/lake build LeanNct:docs
          )
          mkdir -p docs
          cp -r docbuild/.lake/build/doc docs/docs

      - name: Build dependency graph
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20251002
          run: |
            apk add --no-cache graphviz nodejs npm python3
            npm install --no-save --prefix /tmp/mathjax mathjax-full@3.2.2
            python3 dependency_graph/latex_to_graph_json.py blueprint/blueprint.tex /tmp/graph.json
            mkdir -p docs/dependency_graph
            python3 dependency_graph/graph_json_to_html.py /tmp/graph.json docs/dependency_graph/index.html \
              --mathjax-js /tmp/mathjax/node_modules/mathjax-full/es5/tex-svg-full.js \
              --lean-url-pattern 'https://roos-j.github.io/lean-nct/docs/find/?pattern={lean_name}&strict=false#doc'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
