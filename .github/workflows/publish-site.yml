name: Build and publish documentation

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install elan
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"

      - name: Get cache
        run: ~/.elan/bin/lake exe cache get || true

      - name: Build project
        run: ~/.elan/bin/lake build LeanNct

      - name: Build API documentation
        uses: leanprover-community/docgen-action@3dbd3475a9bc8d22fd786a8f8efe1869457da7cc # 2026-01-15
        with:
          blueprint: false
          homepage: site

      - name: Build dependency graph
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            apk add --no-cache graphviz nodejs npm python3
            npm install --no-save --prefix /tmp/mathjax mathjax-full@3.2.2
            python3 dependency_graph/latex_to_graph_json.py blueprint/blueprint.tex /tmp/graph.json
            mkdir -p site/dependency_graph
            python3 dependency_graph/graph_json_to_html.py /tmp/graph.json site/dependency_graph/index.html \
              --mathjax-js /tmp/mathjax/node_modules/mathjax-full/es5/tex-svg-full.js \
              --lean-url-pattern 'https://roos-j.github.io/lean-nct/docs/find/?pattern={lean_name}&strict=false#doc'

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          name: final-site
          path: site

      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: final-site
