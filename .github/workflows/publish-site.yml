name: Build and publish documentation

on:
  push:
    paths:
      - "blueprint/blueprint.tex"
      - "LeanNct.lean"
      - "LeanNct/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "dependency_graph/latex_to_graph_json.py"
      - "dependency_graph/graph_json_to_html.py"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space for API documentation
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true

      # This is the cache used by docgen-action: it preserves rendered
      # documentation for dependencies while LeanNct's docs are rebuilt.
      - name: Cache dependency API documentation
        uses: actions/cache@v4
        with:
          key: Docs-${{ hashFiles('lake-manifest.json') }}
          path: |
            docbuild/.lake/build/doc/Mathlib
            docbuild/.lake/build/doc/Archive
            docbuild/.lake/build/doc/Counterexamples
            docbuild/.lake/build/doc/Plausible
            docbuild/.lake/build/doc/LeanSearchClient
            docbuild/.lake/build/doc/ImportGraph
            docbuild/.lake/build/doc/ProofWidgets
            docbuild/.lake/build/doc/Aesop
            docbuild/.lake/build/doc/Qq
            docbuild/.lake/build/doc/Batteries
            docbuild/.lake/build/doc/Cli
            docbuild/.lake/build/doc/Init
            docbuild/.lake/build/doc/Lake
            docbuild/.lake/build/doc/Lean
            docbuild/.lake/build/doc/Std

      - name: Build API documentation
        shell: bash
        run: |
          set -euo pipefail
          lean_version="$(cut -d: -f2 < lean-toolchain)"
          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "lean-nct"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$lean_version"
          EOF
          (
            cd docbuild
            MATHLIB_NO_CACHE_ON_UPDATE=1 lake update lean-nct
            lake build LeanNct:docs
          )
          mkdir -p site
          cp -r docbuild/.lake/build/doc site/docs

      - name: Extract dependency graph data
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            mkdir -p .graph-build
            python3 dependency_graph/latex_to_graph_json.py \
              blueprint/blueprint.tex \
              .graph-build/graph.json

      - name: Render dependency graph
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes graphviz
          npm install --no-save --prefix "$RUNNER_TEMP/mathjax" mathjax-full@3.2.2
          mkdir -p site/dependency_graph
          python3 dependency_graph/graph_json_to_html.py \
            .graph-build/graph.json \
            site/dependency_graph/index.html \
            --mathjax-js "$RUNNER_TEMP/mathjax/node_modules/mathjax-full/es5/tex-svg-full.js" \
            --lean-url-pattern 'https://roos-j.github.io/lean-nct/docs/find/?pattern={lean_name}&strict=false#doc'
          rm -rf .graph-build

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
