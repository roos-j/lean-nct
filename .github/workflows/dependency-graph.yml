name: Publish dependency graph

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish_dependency_graph:
    runs-on: ubuntu-latest
    name: Publish dependency graph HTML
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update dependency graph HTML
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            apk add --no-cache graphviz nodejs npm python3
            npm install --no-save --prefix /tmp/mathjax mathjax-full@3.2.2
            python3 dependency_graph/latex_to_graph_json.py blueprint/blueprint.tex /tmp/graph.json
            python3 dependency_graph/graph_json_to_html.py /tmp/graph.json dependency_graph/index.html \
              --mathjax-js /tmp/mathjax/node_modules/mathjax-full/es5/tex-svg-full.js \
              --lean-url-pattern 'https://roos-j.github.io/lean-nct/docs/find/?pattern={lean_name}&strict=false#doc'

      - name: Prepare Pages artifact
        shell: bash
        run: |
          test -f dependency_graph/index.html
          mkdir -p site/dependency_graph
          cp dependency_graph/index.html site/dependency_graph/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dependency graph
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dependency graph
        id: deployment
        uses: actions/deploy-pages@v4
