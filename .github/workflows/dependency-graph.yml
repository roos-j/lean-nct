name: Publish dependency graph

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish_dependency_graph:
    runs-on: ubuntu-latest
    name: Publish dependency graph HTML
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        shell: bash
        run: |
          test -f dependency_graph/index.html
          mkdir -p site/dependency_graph
          cp dependency_graph/index.html site/dependency_graph/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dependency graph
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dependency graph
        id: deployment
        uses: actions/deploy-pages@v4
