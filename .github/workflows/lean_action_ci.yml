name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history lets doc-gen4 construct stable GitHub source links.
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
      - name: Build and deploy API documentation
        uses: leanprover-community/docgen-action@v1
        with:
          api-docs: true
          blueprint: false
          build-page: false
          homepage: site
          # Run CI on every push, but publish Pages only from the default branch.
          deploy: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
